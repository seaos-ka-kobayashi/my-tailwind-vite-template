<!doctype html>
<html lang="ja">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEAOS Mockup</title>
  </head>
  <body class="bg-background-default text-foreground-default flex items-center justify-center h-screen">
